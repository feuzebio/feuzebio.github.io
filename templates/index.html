<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor TTS Português Brasileiro</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f7f6;
        }
        .container {
            text-align: center;
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 500px;
        }
        h1 {
            color: #333;
            font-weight: 600;
        }
        p {
            color: #666;
            margin-bottom: 25px;
        }
        textarea {
            width: 100%;
            height: 150px;
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            font-size: 16px;
            resize: vertical;
        }
        button {
            margin-top: 20px;
            padding: 12px 25px;
            border: none;
            background-color: #007bff;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: background-color 0.3s, transform 0.1s;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:active {
            transform: scale(0.98);
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        #audioPlayer {
            margin-top: 20px;
            width: 100%;
        }
        .status {
            margin-top: 15px;
            color: #d9534f;
            height: 20px; /* Reserve space to prevent layout shifts */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Conversor TTS Português Brasileiro</h1>
        <p>Insira o texto que deseja converter para áudio na caixa abaixo.</p>
        <textarea id="textToSpeak" placeholder="Digite seu texto aqui..."></textarea>
        <button id="speakButton">Converter para Áudio</button>
        <div id="status" class="status"></div>
        <audio id="audioPlayer" controls></audio>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const speakButton = document.getElementById('speakButton');
            const textToSpeak = document.getElementById('textToSpeak');
            const audioPlayer = document.getElementById('audioPlayer');
            const statusDiv = document.getElementById('status');

            speakButton.addEventListener('click', async function() {
                const text = textToSpeak.value.trim();

                if (text === '') {
                    statusDiv.textContent = 'Por favor, insira um texto para converter.';
                    return;
                }

                speakButton.disabled = true;
                speakButton.textContent = 'Convertendo...';
                statusDiv.textContent = '';

                try {
                    const response = await fetch('/api/tts', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ text: text })
                    });

                    if (!response.ok) {
                        throw new Error(`Erro na API: ${response.statusText}`);
                    }

                    const audioBlob = await response.blob();
                    const audioUrl = URL.createObjectURL(audioBlob);
                    audioPlayer.src = audioUrl;
                    audioPlayer.play();

                } catch (error) {
                    console.error('Erro ao converter texto para áudio:', error);
                    statusDiv.textContent = 'Ocorreu um erro ao gerar o áudio. Tente novamente.';
                } finally {
                    speakButton.disabled = false;
                    speakButton.textContent = 'Converter para Áudio';
                }
            });
        });
    </script>
</body>
</html>
